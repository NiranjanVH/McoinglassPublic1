name: Run BTC signal trader

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-auto-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_TARGET_CHAT: ${{ secrets.TG_TARGET_CHAT }}
      TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
      TG_SESSION_FILE_B64: ${{ secrets.TG_SESSION_FILE_B64 }}
      COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
      COINDCX_API_SECRET: ${{ secrets.COINDCX_API_SECRET }}
      OCI_VM_HOST: ${{ secrets.OCI_VM_HOST }}
      OCI_VM_PORT: ${{ secrets.OCI_VM_PORT }}
      OCI_VM_USER: ${{ secrets.OCI_VM_USER }}
      OCI_SSH_PRIVATE_KEY_B64: ${{ secrets.OCI_SSH_PRIVATE_KEY_B64 }}
      OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
      DRY_RUN: "false"
      SSH_STRICT_HOST_KEY_CHECKING: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore signal state
        uses: actions/cache/restore@v4
        with:
          path: last_processed_signal_id.txt
          key: btc-trader-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: btc-trader-state-

      - name: Configure SSH host verification
        shell: bash
        run: |
          if [[ -n "$TG_SESSION_FILE_B64" ]]; then
            session_file="$RUNNER_TEMP/telegram_session.session"
            if ! printf '%s' "$TG_SESSION_FILE_B64" | base64 --decode > "$session_file"; then
              echo "TG_SESSION_FILE_B64 is not valid base64-encoded Telethon session data." >&2
              exit 1
            fi
            chmod 600 "$session_file"
            printf 'TG_SESSION_NAME=%s/telegram_session\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
            printf 'TG_SESSION_STRING=\n' >> "$GITHUB_ENV"
          elif [[ -z "$TG_SESSION_STRING" ]]; then
            echo "Set TG_SESSION_FILE_B64 (recommended) or TG_SESSION_STRING in Actions secrets." >&2
            exit 1
          fi
          if [[ "$SSH_STRICT_HOST_KEY_CHECKING" == "true" ]]; then
            if [[ -z "$OCI_SSH_KNOWN_HOSTS" || -z "$OCI_VM_HOST" ]]; then
              echo "Strict SSH checking requires OCI_SSH_KNOWN_HOSTS and OCI_VM_HOST." >&2
              exit 1
            fi
            umask 077
            known_hosts_file="$RUNNER_TEMP/oci_known_hosts"
            printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$known_hosts_file"
            ssh_port="${OCI_VM_PORT:-22}"
            known_hosts_name="$OCI_VM_HOST"
            if [[ "$ssh_port" != "22" ]]; then
              known_hosts_name="[$OCI_VM_HOST]:$ssh_port"
            fi
            matching_host_keys="$(ssh-keygen -F "$known_hosts_name" -f "$known_hosts_file" 2>/dev/null || true)"
            if [[ -z "$matching_host_keys" ]]; then
              echo "OCI_SSH_KNOWN_HOSTS has no entry matching OCI_VM_HOST and OCI_VM_PORT." >&2
              echo "Use the host as the first field (or [host]:port for non-default ports)." >&2
              exit 1
            fi
            if ! grep -Eq '(^|[[:space:]])ssh-ed25519(-cert-v01@openssh\.com)?[[:space:]]' <<< "$matching_host_keys"; then
              echo "The matching OCI_SSH_KNOWN_HOSTS entry has no Ed25519 host key." >&2
              exit 1
            fi
            printf 'SSH_KNOWN_HOSTS_FILE=%s\n' "$known_hosts_file" >> "$GITHUB_ENV"
          else
            echo "::warning::SSH host-key verification is disabled for this dry-run connectivity test only."
          fi

      - name: Run trader
        run: python btc_auto_trader.py

      - name: Save signal state
        if: ${{ success() && hashFiles('last_processed_signal_id.txt') != '' }}
        uses: actions/cache/save@v4
        with:
          path: last_processed_signal_id.txt
          key: btc-trader-state-${{ github.run_id }}-${{ github.run_attempt }}
