name: Run BTC signal trader

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-auto-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_TARGET_CHAT: ${{ secrets.TG_TARGET_CHAT }}
      TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
      COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
      COINDCX_API_SECRET: ${{ secrets.COINDCX_API_SECRET }}
      OCI_VM_HOST: ${{ secrets.OCI_VM_HOST }}
      OCI_VM_PORT: ${{ secrets.OCI_VM_PORT }}
      OCI_VM_USER: ${{ secrets.OCI_VM_USER }}
      OCI_SSH_PRIVATE_KEY_B64: ${{ secrets.OCI_SSH_PRIVATE_KEY_B64 }}
      OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
      DRY_RUN: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore signal state
        uses: actions/cache/restore@v4
        with:
          path: last_processed_signal_id.txt
          key: btc-trader-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: btc-trader-state-

      - name: Configure verified SSH host key
        shell: bash
        run: |
          if [[ -z "$TG_SESSION_STRING" ]]; then
            echo "Missing required Actions secret: TG_SESSION_STRING" >&2
            exit 1
          fi
          if [[ -z "$OCI_SSH_KNOWN_HOSTS" ]]; then
            echo "Missing required Actions secret: OCI_SSH_KNOWN_HOSTS" >&2
            exit 1
          fi
          umask 077
          known_hosts_file="$RUNNER_TEMP/oci_known_hosts"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          printf 'SSH_KNOWN_HOSTS_FILE=%s\n' "$known_hosts_file" >> "$GITHUB_ENV"

      - name: Run trader
        run: python btc_auto_trader.py

      - name: Save signal state
        if: ${{ success() && hashFiles('last_processed_signal_id.txt') != '' }}
        uses: actions/cache/save@v4
        with:
          path: last_processed_signal_id.txt
          key: btc-trader-state-${{ github.run_id }}-${{ github.run_attempt }}
